<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-volta.svg" />
    <!-- viewport-fit=cover: without it, env(safe-area-inset-*) always resolves
         to 0 — meaning no code anywhere in this app could ever actually
         compensate for the iOS status bar / home-indicator area, since the
         values it would read were never non-zero to begin with. Needed
         together with apple-mobile-web-app-status-bar-style=black-translucent
         below, which makes content draw full-bleed under the status bar in
         standalone (added-to-homescreen) mode specifically. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VOLTA Fitness</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VOLTA">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <!-- Direction corail (2026-08-06): was #0A0A0A (leftover from the old
         dark identity, never updated in the coral pivot). This is the flat
         color Safari paints in any gap between actual rendered content and
         the true device viewport — scroll rubber-band overshoot, or a
         viewport-height mismatch like the one caused by the in-call status
         bar (the black pill with the phone icon showing at the top of a
         screenshot) temporarily resizing the visible web viewport. Left as
         #0A0A0A, every such gap read as a solid black "hole" at the bottom
         of an otherwise coral screen — reported directly. #C6371E is the
         gradient's 82% stop (see global.css body), the tone that covers
         most of the screen once past the lighter top-left origin, so a
         flat fallback color blends acceptably regardless of where the gap
         lands. -->
    <meta name="theme-color" content="#C6371E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
