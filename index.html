<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-volta.svg" />
    <!-- viewport-fit=cover: without it, env(safe-area-inset-*) always resolves
         to 0 — meaning no code anywhere in this app could ever actually
         compensate for the iOS status bar / home-indicator area, since the
         values it would read were never non-zero to begin with. Needed
         together with apple-mobile-web-app-status-bar-style=black-translucent
         below, which makes content draw full-bleed under the status bar in
         standalone (added-to-homescreen) mode specifically. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VOLTA Fitness</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VOLTA">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <!-- Direction "pastel chaud" (2026-08-20): was #EF6B41 (corail, set
         2026-08-06 — see git history for that session's reasoning, no
         longer applicable). This is the flat color Safari/iOS paints its
         OWN chrome with — the status bar strip at the very top of the
         screen (always, tab or standalone) and any gap between rendered
         content and the true device viewport. Every *-redesign.css screen
         already patches its own safe-area-inset-top strip to its crème bg
         (e.g. .auth-redesign::before, .settings-redesign::before) — this
         meta tag was the one piece of "old design" still visibly behind
         that patch (and, more importantly per public/manifest.json's
         matching background_color, the color iOS/Android paint full-screen
         for roughly half a second while generating the native "Add to Home
         Screen" splash, before any CSS loads — was still #0A0A0A dark,
         nothing to do with corail even, an even older leftover). #EFE7D9
         matches manifest.json's background_color and every redesigned
         screen's crème, so there's now one consistent tone from native
         splash through to first paint instead of three different ones. -->
    <meta name="theme-color" content="#EFE7D9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Poppins ajouté pour le restyle VOLTA "pastel chaud" (Dashboard.jsx,
         import Claude Design 2026-08-13) — scopé via .dashboard-redesign
         dans dashboard.css, ne change la police d'aucun autre écran. -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
