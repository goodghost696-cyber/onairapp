<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-volta.svg" />
    <!-- viewport-fit=cover: without it, env(safe-area-inset-*) always resolves
         to 0 — meaning no code anywhere in this app could ever actually
         compensate for the iOS status bar / home-indicator area, since the
         values it would read were never non-zero to begin with. Needed
         together with apple-mobile-web-app-status-bar-style=black-translucent
         below, which makes content draw full-bleed under the status bar in
         standalone (added-to-homescreen) mode specifically. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VOLTA Fitness</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VOLTA">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <!-- Direction corail (2026-08-06): was #0A0A0A (leftover from the old
         dark identity, never updated in the coral pivot). This is the flat
         color Safari/iOS paints its OWN chrome with — the status bar strip
         at the very top of the screen (always, tab or standalone) and any
         gap between rendered content and the true device viewport. #C6371E
         (the gradient's 82% stop) was picked to "blend acceptably wherever
         the gap lands" on the assumption the gap could appear anywhere —
         but the status bar area is not a random gap, it's a FIXED strip at
         the very top, exactly where the body gradient (global.css) is
         brightest (radial-gradient centered at 18% -8%, i.e. just above
         the top edge — #FF8355 at its 0% stop). #C6371E being a much
         darker, later stop created a visible seam right at the top,
         reported directly ("le haut de page est plus sombre") on a real
         screenshot. Moved to a lighter tone closer to the gradient's own
         top-of-screen color instead of the flat mid-gradient compromise. -->
    <meta name="theme-color" content="#EF6B41">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
